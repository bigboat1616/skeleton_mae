# SkeletonMAE Pretraining Configuration
# Based on SkeletonMAE paper settings
SEED: 0

# Training Parameters (Paper: Adam, lr=1.5e-4, batch_size=1024, epochs=50)
TRAIN:
    batch_size: 1024  # Reduced from 1024 due to memory constraints
    epochs: 50      # Paper: 50 epochs
    num_workers: 0
    input_track_size: 9
    output_track_size: 9
    track_size: 16
    frequency: 1
    lr: 0.00015     # Paper: 1.5e-4
    lr_decay: 0.95
    lr_drop: true
    aux_weight: 0.2
    val_frequency: 5
    optimizer: "adam"  # Paper: Adam
    max_grad_norm: 1.0

# Data Configuration
DATA:
    name: jta_3dp_row
    train_datasets:
        - jta_3dp_row
    input_dir: data/jta_3dp
    split: train
    scene_type: rows

# Model Configuration (Paper: PReLU activation, mask_rate=0.15)
MODEL:
    lr: 0.00015     # Paper: 1.5e-4
    weight_decay: 0.0001
    max_epoch: 50   # Paper: 50 epochs
    mask_rate: 0.5 # Paper: 15% masking ratio
    drop_edge_rate: 0.0
    max_masked_weight: 3.0  # Increased for better reconstruction
    random_seed: 42
    num_hidden: 256
    num_layers: 2
    encoder: stgcn
    decoder: linear
    activation: prelu  # Paper: PReLU activation
    pooling: sum
    scheduler: true
    batch_size: 1024   # Reduced from paper's 1024
    replace_rate: 0.1
    norm: layernorm
    loss_fn: rce  # Paper: RCE (Re-weighted Cosine Error)
    alpha_l: 2
    beta: 2.0     # Paper: β = 2 for RCE
    # Feature reconstruction parameters
    feature_dim: 128   # D-dimensional feature space for reconstruction
